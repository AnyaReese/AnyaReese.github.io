<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幻灯片 - Anya Reese</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .container {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            height: auto;
            min-height: 100vh;
            padding: 50px 20px;
        }
        
        .back-link {
            align-self: flex-start;
            margin-bottom: 30px;
            color: var(--link-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: var(--link-hover-color);
        }
        
        .content {
            max-width: 700px;
            text-align: left;
            line-height: 1.6;
        }
        
        .content h2 {
            margin: 25px 0 15px;
            text-align: left;
            color: var(--text-color);
        }
        
        .content p {
            margin-bottom: 15px;
        }
        
        .slides-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .slide-item {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .slide-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .slide-thumbnail {
            height: 120px;
            background-color: var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .slide-thumbnail i {
            font-size: 36px;
            color: var(--link-color);
        }
        
        .slide-info {
            padding: 10px;
        }
        
        .slide-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .slide-date {
            font-size: 12px;
            color: var(--link-color);
        }
        
        .category-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }
        
        .category-item {
            color: var(--link-color);
            text-decoration: none;
            background-color: var(--border-color);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .category-item:hover {
            background-color: var(--link-color);
            color: var(--bg-color);
        }
    </style>
</head>
<body>
    <!-- 波浪背景 -->
    <a-waves>
        <svg class="js-svg"></svg>
    </a-waves>

    <div class="container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> 返回首页
        </a>
        
        <div class="profile">
            <h1>幻灯片</h1>
            <h2>我的演讲和分享</h2>
        </div>
        
        <div class="content">
            <p>这里收集了我的技术演讲和分享幻灯片，涵盖了各种技术主题。</p>
            
            <h2>分类</h2>
            <div class="category-list">
                <a href="#" class="category-item">全部</a>
                <a href="#" class="category-item">Web开发</a>
                <a href="#" class="category-item">Python</a>
                <a href="#" class="category-item">人工智能</a>
                <a href="#" class="category-item">数据科学</a>
            </div>
            
            <h2>最近幻灯片</h2>
            <div class="slides-list">
                <a href="#" class="slide-item">
                    <div class="slide-thumbnail">
                        <i class="fas fa-desktop"></i>
                    </div>
                    <div class="slide-info">
                        <div class="slide-title">现代前端开发工作流</div>
                        <div class="slide-date">2024-03-10</div>
                    </div>
                </a>
                <a href="#" class="slide-item">
                    <div class="slide-thumbnail">
                        <i class="fas fa-desktop"></i>
                    </div>
                    <div class="slide-info">
                        <div class="slide-title">Python在数据科学中的应用</div>
                        <div class="slide-date">2024-02-15</div>
                    </div>
                </a>
                <a href="#" class="slide-item">
                    <div class="slide-thumbnail">
                        <i class="fas fa-desktop"></i>
                    </div>
                    <div class="slide-info">
                        <div class="slide-title">机器学习入门：实践指南</div>
                        <div class="slide-date">2024-01-20</div>
                    </div>
                </a>
                <a href="#" class="slide-item">
                    <div class="slide-thumbnail">
                        <i class="fas fa-desktop"></i>
                    </div>
                    <div class="slide-info">
                        <div class="slide-title">React Hooks深入浅出</div>
                        <div class="slide-date">2023-12-05</div>
                    </div>
                </a>
                <a href="#" class="slide-item">
                    <div class="slide-thumbnail">
                        <i class="fas fa-desktop"></i>
                    </div>
                    <div class="slide-info">
                        <div class="slide-title">容器化部署最佳实践</div>
                        <div class="slide-date">2023-11-18</div>
                    </div>
                </a>
                <a href="#" class="slide-item">
                    <div class="slide-thumbnail">
                        <i class="fas fa-desktop"></i>
                    </div>
                    <div class="slide-info">
                        <div class="slide-title">Web安全防护指南</div>
                        <div class="slide-date">2023-10-22</div>
                    </div>
                </a>
            </div>
        </div>
        
        <footer>
            <p>Copyright © 2024 @AnyaReese</p>
        </footer>
    </div>
    
    <div class="theme-switch">
        <i class="fas fa-moon"></i>
    </div>

    <!-- 脚本 -->
    <script src="js/Noise.js"></script>
    <script src="js/waves.js"></script>
    <script src="script.js"></script>
</body>
</html>
